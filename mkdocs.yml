site_name: webDMX Wiki
site_url: https://wiki.webdmx.com

theme:
  name: material
  language: custom

  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Light mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Dark mode

extra:
  alternate:
    - name: English
      link: /en/
      lang: en

    - name: Deutsch
      link: /de/
      lang: de

plugins:
  - search:
      lang:
        - en
        - de
